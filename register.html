<!DOCTYPE html>
<html>
<head>
    <title>Register - Foodie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <h1>Create Account</h1>
        <p>Register to get started with Foodie.</p>
        <form onsubmit="registerUser(event)">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Enter your name" required>
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Create a password" minlength="6" required>
            <button class="auth-button" type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
        <a class="back-home" href="index.html">← Back to Home</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
